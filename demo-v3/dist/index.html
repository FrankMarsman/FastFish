<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eff6f2"><title>Frank Fish V3</title><link rel="stylesheet" href="style.css"></head>
<body><canvas id="sea" role="img" aria-label="A composition of closely packed, hand-drawn fish"></canvas>
<header id="controls"><label for="count">Fish count <output id="countValue">500</output><input id="count" type="range" min="50" max="5000" step="50" value="500"></label><label for="gap">Gap <output id="gapValue">4 px</output><input id="gap" type="range" min="0" max="20" step="1" value="4"></label><span id="status" role="status" aria-live="polite">Preparing fish…</span></header>
<script src="app.js"></script></body></html>
