<!doctype html><html lang="en"><meta charset="utf-8"><title>Frank Fish V3 gallery renderer</title><style>body{font:14px system-ui;color:#244f53;background:#eff6f2;margin:24px}img{max-width:46%;vertical-align:top;margin:1%}pre{white-space:pre-wrap}</style><h1>Frank Fish V3 gallery renderer</h1><p>Actual V3 worker output. Four sizes, growing fish collection, 4 px gap. Controls omitted from the artwork.</p><pre id="status">Starting…</pre><pre id="results"></pre><div id="gallery"></div><script>
const cases=[{width:500,height:375,count:500},{width:1000,height:750,count:1500},{width:1500,height:1125,count:3000},{width:2000,height:1500,count:5000}],worker=new Worker('../dist/worker.js');let revision=0;
const status=document.getElementById('status'),results=document.getElementById('results'),gallery=document.getElementById('gallery');
function render(c){const rev=++revision;return new Promise((resolve,reject)=>{worker.onmessage=({data:d})=>{if(d.revision!==rev){d.bitmap?.close();return;}if(d.type==='progress')status.textContent=c.width+' × '+c.height+' · target '+c.count+' · '+d.text;if(d.type==='error')reject(Error(d.message));if(d.type==='done')resolve(d);};worker.onerror=reject;worker.postMessage({type:'layout',revision:rev,...c,gap:4,top:0,dpr:1,validate:true});});}
(async()=>{const samples=[];try{for(const c of cases){const started=performance.now(),d=await render(c),v=d.validation;if(v.overlaps||v.outside||v.uncovered)throw Error(JSON.stringify(v));if(d.generated!==c.count)throw Error('Unexpected geometry cache count');const canvas=new OffscreenCanvas(c.width,c.height);canvas.getContext('2d').drawImage(d.bitmap,0,0);d.bitmap.close();const blob=await canvas.convertToBlob({type:'image/png'}),file='composition-'+c.width+'-'+c.count+'.png';const response=await fetch('/save/'+file,{method:'POST',body:blob});if(!response.ok)throw Error('Saving PNG failed');const img=new Image();img.src=URL.createObjectURL(blob);img.alt=c.width+' × '+c.height+', target '+c.count+', '+d.placed+' fish placed';gallery.append(img);const entry={file,...c,gap:4,placed:d.placed,generated:d.generated,validation:v,seconds:+((performance.now()-started)/1000).toFixed(1)};samples.push(entry);results.textContent+='PASS '+JSON.stringify(entry)+'\n';}const manifest={description:'Real V3 compositions, rendered with the production worker at 1× resolution. Seed collection is deterministic. Controls are omitted; the full canvas is available to the fish.',samples};const saved=await fetch('/save/manifest.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(manifest,null,2)+'\n'});if(!saved.ok)throw Error('Saving manifest failed');status.textContent='ALL PASS — four PNG compositions saved';}catch(e){status.textContent='FAIL '+e.stack;}finally{worker.terminate();}})();
</script></html>
