<!doctype html><meta charset="utf-8"><title>V3 verification</title><pre id="results">Running real fish generation and packing tests…\n</pre><script>
const out=document.querySelector('pre'),worker=new Worker('../dist/worker.js');let revision=0,expectedGenerated=0;
function log(s){out.textContent+=s+'\n';}
function request(count,gap,width,height){const rev=++revision;return new Promise((resolve,reject)=>{const started=performance.now();worker.onmessage=({data:d})=>{if(d.revision!==rev){d.bitmap?.close();return;}if(d.type==='error')reject(Error(d.message));if(d.type==='done'){d.bitmap.close();const v=d.validation;if(v.overlaps||v.outside||v.uncovered)reject(Error(JSON.stringify(v)));else{expectedGenerated=Math.max(expectedGenerated,count);if(v.generated!==expectedGenerated)reject(Error('Geometry cache was not reused'));else{log('PASS '+count+' fish target / gap '+gap+' / '+width+'×'+height+': '+d.placed+' placed; zero overlap, zero outside, zero uncovered ink; cache '+v.generated+'; '+((performance.now()-started)/1000).toFixed(1)+' s');resolve();}}}};worker.onerror=reject;worker.postMessage({type:'layout',revision:rev,count,gap,width,height,top:90,dpr:1,validate:true});});}
(async()=>{try{await request(100,0,1280,800);await request(500,4,1280,800);await request(100,20,390,844);log('ALL PASS: rendered stroke coverage, silhouette separation and containment');}catch(e){log('FAIL '+e.stack);}finally{worker.terminate();}})();
</script>
